<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Degustação</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        overflow-x: hidden;
        max-width: 100%;
      }
      body {
        margin: 0;
      }
      /* Printing exists to put the QR sheet on a table. */
      @media print {
        body * {
          visibility: hidden;
        }
        .qr-sheet,
        .qr-sheet * {
          visibility: visible;
        }
        .qr-sheet {
          position: absolute;
          inset: 0 auto auto 0;
          width: 100%;
          border: 0 !important;
        }
        .no-print {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
